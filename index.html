</style></head><body><div id="stage"></div><div id="ui"><div id="start"><h1>THE POCKET</h1><p>LITTLE EXPLORERS · Choose your Cephalopod!</p><div class="choices"><button class="choice" data-type="octopus"><span>🐙</span>Octopus</button><button class="choice" data-type="squid"><span>🦑</span>Squid</button><button class="choice" data-type="nautilus"><span>🐚</span>Nautilus</button><button class="choice" data-type="cuttlefish"><span>🌊</span>Cuttlefish</button></div><p class="small">Level 1 · The Minister's Missing Notebook</p></div><div id="hud"><div id="top"><div class="pill" id="objective">🔎 Find the notebook</div><button class="help" id="help">👁 HELP</button></div><button id="sound">🔊 Voice on</button><div id="bottom"><div id="inventory">My Bag<div id="item">—</div></div><div id="talk" aria-live="polite">👁 Hello, explorer!</div></div></div><div id="modal"><div id="panel"></div></div><div id="win"><h1>🌟 MISSION COMPLETE! 🌟</h1><p>You found the Minister's notebook and activated the elevator!</p><p>More adventures coming soon.</p><button id="again">Play again</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color('#0b2854');const camera=new THREE.PerspectiveCamera(49,innerWidth/innerHeight,.1,100);camera.position.set(0,5.6,13.4);camera.lookAt(0,1.6,-1);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);$('stage').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xc2efff,0x223164,2.4));for(const [c,x,y,z,i] of [[0x68e5ff,0,6,1,90],[0xff62d9,-4,4,-1,35]]){let l=new THREE.PointLight(c,i,24);l.position.set(x,y,z);scene.add(l)}
const mat=(c,glow=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.4,metalness:.2,emissive:c,emissiveIntensity:glow});const materials={wall:mat('#204b7a'),floor:mat('#1a3766'),glow:mat('#61edff',.65),pink:mat('#ce77ff',.5),gold:mat('#ffdb75',.25),metal:mat('#577aa2')};const targets=[];function add(mesh,x,y,z,key){mesh.position.set(x,y,z);scene.add(mesh);if(key){mesh.userData.key=key;targets.push(mesh)}return mesh}function box(w,h,d,x,y,z,m,key){return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m),x,y,z,key)}function orb(r,x,y,z,m,key){return add(new THREE.Mesh(new THREE.SphereGeometry(r,22,16),m),x,y,z,key)}function cyl(r,h,x,y,z,m,key){return add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18),m),x,y,z,key)}
box(13,.25,9,0,-.15,0,materials.floor);box(13,7,.25,0,3.35,-4.5,materials.wall);box(.2,7,9,-6.5,3.35,0,materials.wall);box(.2,7,9,6.5,3.35,0,materials.wall);for(let x=-6;x<7;x+=2)box(.045,.02,9,x,0,0,materials.glow);for(let z=-4;z<5;z+=2)box(13,.02,.045,0,0,z,materials.glow);for(let x of [-4,0,4])box(2,.14,.2,x,5.9,-4.25,materials.glow);
// Interactables are generously sized for preschool taps.
box(3,.25,1.6,-3.3,1.4,-2.2,materials.metal,'desk');for(let x of [-4.55,-2.05])box(.18,1.35,.18,x,.62,-2.2,materials.metal);const drawer=box(1.5,.55,.15,-3.4,.94,-1.34,mat('#8c68c2'),'drawer');orb(.09,-2.88,.95,-1.2,materials.gold,'drawer');const cabinet=box(1.75,2.55,.8,-5.15,1.38,-3.45,mat('#3e7896'),'cabinet');const cabDoor=box(1.65,2.4,.14,-5.15,1.38,-2.97,mat('#7654aa'),'cabinet');orb(.1,-4.58,1.3,-2.85,materials.gold,'cabinet');
const screen=box(1.65,1.15,.14,-.6,2.0,-4.24,mat('#397fbd',.25),'terminal');box(1.45,.12,.17,-.6,1.7,-4.12,materials.glow,'terminal');const microscope=orb(.38,1.4,1.4,-2.6,materials.metal,'microscope');cyl(.15,.8,1.5,1.9,-2.65,materials.pink,'microscope');box(2.3,.2,1.3,1.2,1.0,-2.6,materials.metal,'microscope');for(let x of [.2,2.2])box(.15,.9,.15,x,.45,-2.6,materials.metal);

const door=box(2.6,4,.18,4.4,2,-4.29,mat('#4a598e'),'door');box(2.9,.18,.28,4.4,4.1,-4.22,materials.glow);const keypad=box(.9,1.25,.25,2.75,1.7,-4.03,materials.pink,'door');const elevator=box(2.8,4,.3,4.4,2,-4.15,mat('#253c69'),'elevator');elevator.visible=false;const elevPanel=box(.7,1,.27,2.8,1.8,-3.9,materials.gold,'elevator');elevPanel.visible=false;

const state={started:false,room:'lab',drawer:false,cabinet:false,notebook:false,door:false,sequence:[],hints:0,voice:true,interactions:new Set()};let audio;function beep(f=500){try{audio??=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.17);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.18)}catch(e){}}function say(s){$('talk').textContent='👁 '+s;if(state.voice&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.rate=.86;u.pitch=1.15;speechSynthesis.speak(u)}}function objective(s){$('objective').textContent=s}function modal(html){$('panel').innerHTML=html;$('modal').style.display='flex'}function close(){ $('modal').style.display='none'}function discover(k){state.interactions.add(k);beep(560)}function glow(m){const s=m.scale.clone();m.scale.multiplyScalar(1.18);setTimeout(()=>m.scale.copy(s),650)}
function interact(key){if(!state.started||$('modal').style.display==='flex')return;discover(key);switch(key){case'desk':case'drawer':if(!state.drawer){state.drawer=true;drawer.position.z+=.65;beep(310);say('You opened the desk drawer! Look inside.');modal('<h2>🗄️ Desk Drawer</h2><p>A shiny star sticker! But no notebook.</p><button id="ok">Keep looking</button>');$('ok').onclick=close}else say('The desk drawer is already open.');break;case'cabinet':if(!state.cabinet){state.cabinet=true;cabDoor.position.x-=1.2;book.visible=true;say('The cabinet opened! I see something yellow!');modal('<h2>🚪 Storage Cabinet</h2><p>Look! The Minister’s notebook!</p><button id="take">📒 Take notebook</button>');$('take').onclick=takeNotebook}else if(!state.notebook)takeNotebook();else say('You already found the notebook!');break;case'notebook':takeNotebook();break;case'terminal':glow(screen);say('The screen shows a clue! Star, moon, star. Remember that pattern!');modal('<h2>🖥️ Computer Clue</h2><p>Look carefully at the shapes.</p><div class="target">⭐ 🌙 ⭐</div><button id="ok">I see it!</button>');$('ok').onclick=close;break;case'microscope':glow(microscope);say('Wow! Tiny glowing space microbes!');modal('<h2>🔬 Microscope</h2><div style="font-size:70px">🦠 ✨</div><p>Little creatures are wiggling!</p><button id="ok">Close</button>');$('ok').onclick=close;break;case'specimen':glow(jar);say('Bloop bloop! The specimen is dancing!');break;case'lamp':lamp.material=mat(['#fa81d8','#76f6ac','#8beaff'][Math.floor(Math.random()*3)],.85);say('You changed the glow lamp!');break;case'eye':say('I am the Eye in the Sky! Tap Help whenever you need me.');break;case'door':if(!state.notebook){say('The Minister needs his notebook first! Look around the lab.');break}if(state.door){say('The door is unlocked! Tap the elevator controls.');break}showDoor();break;case'elevator':if(!state.door){say('First unlock the door by matching the symbols.');break}showElevator();break}}
function takeNotebook(){state.notebook=true;book.visible=false;$('item').textContent='📒';objective('🔐 Unlock the door');close();beep(820);say('You found the notebook! Great job! Now match the shapes on the door. The computer has a clue.')}function showDoor(){state.sequence=[];renderDoor()}function renderDoor(){modal('<h2>🚪 Door Pattern</h2><p>Copy the glowing pattern!</p><div class="target">⭐ 🌙 ⭐</div><p>Your pattern: '+(state.sequence.join(' ')||'○ ○ ○')+'</p><div class="symbols"><button class="symbol" data-s="⭐">⭐</button><button class="symbol" data-s="🌙">🌙</button><button class="symbol" data-s="☀️">☀️</button></div><button id="reset">Start over</button><button id="cancel">Close</button>');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state.sequence.push(b.dataset.s);beep(600);if(state.sequence.length===3){if(state.sequence.join('|')==='⭐|🌙|⭐'){state.door=true;close();door.visible=false;keypad.visible=false;elevator.visible=true;elevPanel.visible=true;objective('🛗 Activate elevator');say('You matched the pattern! The door opened! Tap the gold elevator controls.');beep(880)}else{state.sequence=[];say('Good try! Look at the pattern and try again.');renderDoor()}}else renderDoor()});$('reset').onclick=()=>{state.sequence=[];renderDoor()};$('cancel').onclick=close}
function showElevator(){modal('<h2>🛗 Elevator Matching</h2><p>Which shape matches this one?</p><div class="target">🔷</div><div class="symbols"><button class="symbol" data-match="no">🔴</button><button class="symbol" data-match="yes">🔷</button><button class="symbol" data-match="no">⭐</button></div><button id="cancel">Close</button>');document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>{if(b.dataset.match==='yes'){close();beep(960);say('Wonderful matching! You activated the elevator. Mission complete!');setTimeout(()=>$('win').style.display='flex',1700)}else{beep(250);say('Try another shape. Look for the same blue diamond!')}});$('cancel').onclick=close}
function help(){state.hints=state.hints%3+1;let level=state.hints;if(!state.notebook){let msg=['Let’s look in places where someone might put a notebook.','Try opening the big purple storage cabinet.','Tap the purple cabinet on the left side of the room.'][level-1];say(msg);if(level===3)glow(cabDoor)}else if(!state.door){say(['The door has a pattern to copy.','The computer shows the shapes: star, moon, star.','Tap the door panel, then choose star, moon, star.'][level-1]);if(level===3)glow(keypad)}else{say(['The elevator is almost ready!','Find the gold elevator controls.','Tap the gold panel beside the elevator, then choose the blue diamond.'][level-1]);if(level===3)glow(elevPanel)}}$('help').onclick=help;$('sound').onclick=()=>{state.voice=!state.voice;$('sound').textContent=state.voice?'🔊 Voice on':'🔇 Voice off';if(!state.voice&&'speechSynthesis'in window)speechSynthesis.cancel()};document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{state.started=true;state.type=b.dataset.type;$('start').style.display='none';$('hud').style.display='block';body.material=mat({octopus:'#875ee2',squid:'#398dd6',nautilus:'#c99e70',cuttlefish:'#3bbab2'}[state.type]);say('Welcome, little explorer! The Minister of Science needs his notebook. Search the lab and find it for him!')});$('again').onclick=()=>location.reload();
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(!state.started||$('modal').style.display==='flex'||$('win').style.display==='flex')return;const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(targets.filter(o=>o.visible),false);if(hits.length)interact(hits[0].object.userData.key)});
