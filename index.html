const RACES=['Octopod','Squidian','Cuttleform','Nautiloid'];
let S={page:'choose',race:0,opened:{},notebook:false,door:false,pattern:[],lift:[],hints:0,dialogue:'Choose your explorer to begin!',modal:null,highlight:null,sound:true};
const $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tone(freq=440,duration=.15){if(!S.sound)return;try{let ctx=window.__audio||(window.__audio=new(window.AudioContext||window.webkitAudioContext)());ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration)}catch(e){}}
function speak(t){if(!S.sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.13;speechSynthesis.speak(u)}catch(e){}}
function say(t,voice=true){S.dialogue=t;if(voice)speak(t);const d=$('#dialogue');if(d)d.textContent=t}
function btn(label,onclick,cl='secondary'){return `<button class="${cl}" onclick="${onclick}">${label}</button>`}
function render(){let main='';if(S.page==='choose')main=`<div class="choose"><h1>Choose Your Explorer!</h1><p class="subtitle">Four friends. One big adventure.</p><div class="heroes">${RACES.map((r,i)=>`<button class="hero ${S.race===i?'selected':''}" onclick="selectRace(${i})"><span class="tick">✓</span><img src="${IMG.portraits[i]}" alt="${r} character illustration"><strong>${r}</strong></button>`).join('')}</div>${btn('▶ START ADVENTURE','start()','primary')}</div>`;
else if(S.page==='end')main=`<div class="complete"><div class="big">🎉📓🚀</div><h1>Mission Complete!</h1><p>You found the Minister's notebook and reached the elevator!</p>${btn('↻ Play Again','restart()','primary')}</div>`;
else{let items=[];if(S.page==='lab')items=[['desk','🗄️','Desk','desk'],['cabinet','🚪','Cabinet','cabinet'],['terminal','💻','Computer','terminal'],['microscope','🔬','Microscope','microscope'],['specimen','🪼','Specimen','specimen'],['lamp','💡','Glow Lamp','lamp'],['shelf','📚','Shelf','shelf']];if(S.page==='door')items=[['clue','⭐ 🌙 💎','Look at clue','clue'],['door','🚪','Locked Door','door'],['panel','🔐','Pattern Panel','panel']];if(S.page==='elevator')items=[['lift','🛗','Elevator','lift'],['panel','🔷 🔶','Shape Matcher','elevatorPanel']];main=`<div class="book"><div class="stars"></div><div class="floor"></div><div class="room-title">${S.page==='lab'?'🔬 The Discovery Lab':S.page==='door'?'🚪 The Pattern Door':'🛗 The Elevator'}</div>${items.map(([cl,emoji,label,id])=>`<button class="object ${cl} ${S.opened[id]?'done':''} ${S.highlight===id?'pulse':''}" onclick="interact('${id}')"><span class="emoji">${emoji}</span><span class="tag">${label}</span></button>`).join('')}</div><div class="inventory">🎒 My Bag: ${S.notebook?'<span class="item">📓 Notebook ✓</span>':'<span style="font-weight:500;color:#a3d6e4">Empty — let’s explore!</span>'}</div>`}
$('#app').innerHTML=`<header><div class="brand">THE POCKET <small>LITTLE EXPLORERS</small></div><div class="controls"><button class="round" onclick="help()" aria-label="Help">❔</button><button class="round" onclick="toggleSound()" aria-label="Toggle sound">${S.sound?'🔊':'🔇'}</button></div></header><main class="scene">${main}${S.page!=='end'?`<div class="narration"><div class="eye"></div><div class="dialogue"><b>THE EYE IN THE SKY</b><span id="dialogue">${escapeHTML(S.dialogue)}</span></div><button class="speak" aria-label="Repeat speech" onclick="speak(S.dialogue)">🔁</button></div>`:''}</main><footer>Prototype v1 · The Pocket: Little Explorers · Non-canon adventure</footer>${S.modal?modalHTML():''}`}
function selectRace(i){S.race=i;tone(420+i*80);render();say(`${RACES[i]}! A wonderful choice!`)}
function start(){S.page='lab';S.dialogue=`Hello, ${RACES[S.race]}! The Minister of Science needs his notebook. Let's look around the laboratory!`;tone(650);render();speak(S.dialogue)}
function restart(){S={page:'choose',race:0,opened:{},notebook:false,door:false,pattern:[],lift:[],hints:0,dialogue:'Choose your explorer to begin!',modal:null,highlight:null,sound:S.sound};render()}
function toggleSound(){S.sound=!S.sound;if(!S.sound&&'speechSynthesis'in window)speechSynthesis.cancel();render();if(S.sound)speak(S.dialogue)}
function interact(id){S.highlight=null;tone(350);if(S.page==='lab'){S.opened[id]=true;const words={desk:'The desk drawer slides open! There are colorful pencils inside. But no notebook!',cabinet:'Creak! The cabinet opens. Look! A very important notebook!',terminal:'Beep beep! The computer shows a star, a moon, and a diamond. Remember those shapes!',microscope:'Zoom! Tiny glowing creatures are dancing under the microscope!',specimen:'Wiggle wiggle! The little alien specimen waves hello!',lamp:'Whoosh! The glowing lamp changes colors!',shelf:'The shelf rattles! A secret path to the door is behind the books.'};if(id==='cabinet'&&!S.notebook){S.notebook=true;tone(850,.35);S.modal={type:'found'};}else if(id==='shelf'&&S.notebook){S.modal={type:'goDoor'}}else{S.modal={type:'message',title:id==='cabinet'?'Cabinet':'Discovery!',text:words[id]}}S.dialogue=words[id];render();speak(S.dialogue);return}
if(S.page==='door'){if(id==='clue'){S.modal={type:'clue'};S.dialogue='Look carefully! Star, moon, diamond. Can you copy the pattern?'}else if(id==='panel'||id==='door'){S.modal={type:'door'};S.dialogue='Tap the shapes in the same order as the clue.'}render();speak(S.dialogue);return}
if(S.page==='elevator'){S.modal={type:'lift'};S.dialogue='Match the shapes to make the elevator go!';render();speak(S.dialogue)}}
function modalHTML(){let m=S.modal,inside='';if(m.type==='message')inside=`<h2>${escapeHTML(m.title)}</h2><p>${escapeHTML(m.text)}</p>${btn('Okay! ✓','closeModal()','primary')}`;
if(m.type==='found')inside=`<h2>📓 You Found It!</h2><p>The Minister's notebook goes into your bag!</p>${btn('Hooray! 🎉','closeModal()','primary')}`;
if(m.type==='goDoor')inside=`<h2>🚪 A Secret Door!</h2><p>You have the notebook. Let's see what's beyond the shelf!</p>${btn('Go to the Door ➜','goDoor()','primary')}`;
if(m.type==='clue')inside=`<h2>Remember the Pattern</h2><div class="pattern"><div class="slot">⭐</div><div class="slot">🌙</div><div class="slot">💎</div></div><p>Star, moon, diamond!</p>${btn('I Remember!','closeModal()','primary')}`;
if(m.type==='door')inside=`<h2>🔐 Unlock the Door</h2><p>Copy the pattern: ⭐ 🌙 💎</p><div class="pattern">${[0,1,2].map(i=>`<div class="slot">${S.pattern[i]||'?'}</div>`).join('')}</div><div class="modal-actions">${['💎','⭐','🌙'].map(x=>btn(x,`pickPattern('${x}')`,'choice')).join('')}</div><p style="font-size:14px">${S.pattern.length?'Keep going!':'Tap the shapes in order.'}</p>${btn('↻ Try Again','resetPattern()')} ${btn('Close','closeModal()')}`;
if(m.type==='lift')inside=`<h2>🛗 Elevator Matching</h2><p>Find the same shapes, in order!</p><div class="pattern"><div class="slot">🔵</div><div class="slot">🔺</div><div class="slot">🟨</div></div><div class="pattern">${[0,1,2].map(i=>`<div class="slot">${S.lift[i]||'?'}</div>`).join('')}</div><div class="modal-actions">${['🟨','🔵','🔺'].map(x=>btn(x,`pickLift('${x}')`,'choice')).join('')}</div>${btn('↻ Try Again','resetLift()')} ${btn('Close','closeModal()')}`;
if(m.type==='doorDone')inside=`<h2>✨ Door Unlocked!</h2><p>You did it! Now let's find the elevator.</p>${btn('To the Elevator ➜','goLift()','primary')}`;
if(m.type==='liftDone')inside=`<h2>🎉 Amazing!</h2><p>The elevator is ready. Let's take the notebook to the Minister!</p>${btn('Finish Chapter 1!','finish()','primary')}`;
return `<div class="overlay" role="dialog" aria-modal="true"><div class="modal">${inside}</div></div>`}
function closeModal(){S.modal=null;render()}
function goDoor(){S.modal=null;S.page='door';S.hints=0;S.dialogue='We found the door! Look at the three shapes and copy their order.';tone(620);render();speak(S.dialogue)}
function pickPattern(x){const target=['⭐','🌙','💎'];if(x===target[S.pattern.length]){S.pattern.push(x);tone(580+S.pattern.length*150);if(S.pattern.length===3){S.door=true;S.modal={type:'doorDone'};S.dialogue='Wonderful! You unlocked the door!';render();speak(S.dialogue);return}}else{S.pattern=[];tone(190,.23);S.dialogue='Not quite! That is okay. Try the star first!';speak(S.dialogue)}render()}
function resetPattern(){S.pattern=[];render()}
function goLift(){S.modal=null;S.page='elevator';S.hints=0;S.dialogue='Here is the elevator! Match the circle, triangle, and square.';render();speak(S.dialogue)}
function pickLift(x){const target=['🔵','🔺','🟨'];if(x===target[S.lift.length]){S.lift.push(x);tone(600+S.lift.length*100);if(S.lift.length===3){S.modal={type:'liftDone'};S.dialogue='All the shapes match! Great work!';render();speak(S.dialogue);return}}else{S.lift=[];tone(180,.2);S.dialogue='Try again! Find the blue circle first.';speak(S.dialogue)}render()}
function resetLift(){S.lift=[];render()}
function finish(){S.modal=null;S.page='end';S.dialogue='You did it!';tone(900,.5);render();speak('Hooray! You found the notebook and finished your first adventure!')}
function help(){S.hints=(S.hints%3)+1;let msg='',target=null;if(S.page==='choose')msg='Tap your favorite explorer, then tap Start Adventure!';else if(S.page==='lab'){if(!S.notebook){msg=['Look around! One of these places hides the notebook.','Maybe a cabinet has something important inside.','Tap the cabinet on the right side of the laboratory!'][S.hints-1];target=S.hints===3?'cabinet':null}else{msg=['Great! You have the notebook. Can you find a way out?','Maybe the bookshelf hides a secret.','Tap the shelf near the bottom middle to find the door!'][S.hints-1];target=S.hints===3?'shelf':null}}else if(S.page==='door'){msg=['Look at the clue and the shapes.','The first shape is a star.','Tap the pattern panel, then tap star, moon, diamond.'][S.hints-1];target=S.hints===3?'panel':null}else if(S.page==='elevator'){msg=['Look at the shapes above the empty boxes.','Find the blue circle first.','Tap blue circle, red triangle, then yellow square.'][S.hints-1];target=S.hints===3?'elevatorPanel':null}else msg='You finished! Great exploring!';S.highlight=target;S.dialogue=msg;render();speak(msg)}
render();
</script></body></html>
